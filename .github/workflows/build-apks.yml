name: Build NEXUS APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install Android SDK tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Run unit tests and build all three APKs
      - name: Run tests and build APKs
        run: |
          gradle --no-daemon \
            :nexus-provider:testDebugUnitTest \
            :nexus-framework:testDebugUnitTest \
            :nexus-client:testDebugUnitTest \
            :nexus-framework:assembleDebug \
            :nexus-provider:assembleDebug \
            :nexus-client:assembleDebug

      # Upload APK files
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            nexus-provider/build/outputs/apk/debug/*.apk
            nexus-client/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
